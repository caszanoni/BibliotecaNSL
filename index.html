<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso / Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    /* Card de Login/Cadastro */
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 320px;
      transition: all 0.3s ease;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
    .tab-btn.active {
      background: #007bff;
      color: white;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    input {
      margin-bottom: 1rem;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.6rem;
      border: none;
      background-color: #28a745;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #218838;
    }
    #mensagem {
      margin-top: 1rem;
      text-align: center;
      font-weight: bold;
    }

    /* Modernização da Tela de Boas-Vindas */
    .dashboard-card {
      width: 100%;
      max-width: 500px;
      padding: 2.5rem;
      text-align: center;
    }
    
    .avatar-icon {
      width: 70px;
      height: 70px;
      background-color: #e6f0ff;
      color: #007bff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem auto;
    }

    .welcome-title {
      margin: 0 0 0.5rem 0;
      color: #333;
    }

    .user-badge {
      display: inline-block;
      background-color: #eef2f5;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 1.5rem;
      word-break: break-all;
    }

    /* Cards de Informação no Dashboard */
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .dash-box {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 1rem;
      border-radius: 6px;
      text-align: left;
    }

    .dash-box h4 {
      margin: 0 0 0.3rem 0;
      font-size: 0.85rem;
      color: #6c757d;
      text-transform: uppercase;
    }

    .dash-box p {
      margin: 0;
      font-weight: bold;
      color: #333;
    }

    .btn-logout {
      background-color: #dc3545;
      width: 100%;
      padding: 0.7rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .btn-logout:hover {
      background-color: #c82333;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Tela de Login / Cadastro (Aparece no mesmo Card) -->
  <div id="authCard" class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Cadastrar</button>
    </div>

    <!-- Formulário de Login -->
    <form id="loginForm">
      <h3 style="margin-top:0">Entrar no Sistema</h3>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginSenha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>

    <!-- Formulário de Cadastro -->
    <form id="registerForm" class="hidden">
      <h3 style="margin-top:0">Novo Cadastro</h3>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regSenha" placeholder="Senha" required>
      <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>
  </div>

  <!-- Nova Tela de Boas-Vindas / Dashboard (Inicia Oculta) -->
  <div id="welcomeScreen" class="card dashboard-card hidden">
    <div class="avatar-icon">👤</div>
    <h2 class="welcome-title">Seja Bem-vindo(a)! 🎉</h2>
    <p style="color: #666; margin-top: 0;">Você se autenticou com sucesso.</p>

    <div class="user-badge" id="userEmail">usuario@email.com</div>

    <!-- Grid com dados fictícios ou status -->
    <div class="dash-grid">
      <div class="dash-box">
        <h4>Status</h4>
        <p style="color: #28a745;">● Ativo</p>
      </div>
      <div class="dash-box">
        <h4>Último Acesso</h4>
        <p id="loginTime">Hoje</p>
      </div>
    </div>

    <button class="btn-logout" onclick="logout()">Sair da Conta</button>
  </div>

  <script>
    // URL da API com aspas devidamente fechadas no final
    const API_URL = 'https://script.google.com/macros/s/AKfycbzoYxzYC3fh6kf-VK3JE2gj6OR1Nn_RoQ348k5NPAyLm0Uh9rahbPy_HNk4UzFCeUcZ/exec';

    // Alternar entre Login e Cadastro
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const buttons = document.querySelectorAll('.tab-btn');
      const msg = document.getElementById('mensagem');
      msg.innerText = '';

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        buttons[0].classList.add('active');
        buttons[1].classList.remove('active');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        buttons[0].classList.remove('active');
        buttons[1].classList.add('active');
      }
    }

    // Exibir Tela de Boas-Vindas
    function showWelcomeScreen(email) {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('welcomeScreen').classList.remove('hidden');
      document.getElementById('userEmail').innerText = email;
      
      // Registra a hora atual do login
      const now = new Date();
      document.getElementById('loginTime').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Função para Sair (Logout)
    function logout() {
      document.getElementById('authCard').classList.remove('hidden');
      document.getElementById('welcomeScreen').classList.add('hidden');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginSenha').value = '';
      document.getElementById('mensagem').innerText = '';
      switchTab('login');
    }

    // Submeter Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      sendData({
        action: 'login',
        email: email,
        senha: document.getElementById('loginSenha').value
      }, email);
    });

    // Submeter Cadastro
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      sendData({
        action: 'register',
        email: document.getElementById('regEmail').value,
        senha: document.getElementById('regSenha').value
      });
    });

    // Função de envio de dados com tratamento de erro
    async function sendData(payload, emailLogged = '') {
      const msg = document.getElementById('mensagem');
      msg.innerText = 'Processando...';
      msg.style.color = 'black';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          redirect: 'follow',
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Erro na requisição: ${response.statusText}`);
        }

        const result = await response.json();

        if (result.status === 'success') {
          if (payload.action === 'login') {
            showWelcomeScreen(emailLogged);
          } else if (payload.action === 'register') {
            msg.innerText = result.message;
            msg.style.color = 'green';
            document.getElementById('regEmail').value = '';
            document.getElementById('regSenha').value = '';
          }
        } else {
          msg.innerText = result.message || 'Erro no servidor.';
          msg.style.color = 'red';
        }
      } catch (err) {
        console.error("Erro detalhado:", err);
        msg.innerText = 'Erro ao conectar com o servidor.';
        msg.style.color = 'red';
      }
    }
  </script>
</body>
</html>
